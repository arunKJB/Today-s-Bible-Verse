<!DOCTYPE html>
<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="description"
        content="இன்றைய நம்பிக்கை தரும் நல்வாக்கு"
    >

    <title>
        ✝️ இன்றைய நம்பிக்கை தரும் நல்வாக்கு ✝️
    </title>


    <!-- Google Tamil + English Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         BACKGROUND
         ================================================= -->

    <div class="background"></div>

    <div id="golden-glow"></div>


    <!-- =================================================
         TOP RIGHT LOGO
         ================================================= -->

    <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTo9vJnAw9zUWALqdEMLAM23hUqinZK8O3flcWTyxQd6g&s=10"
        alt="Krishnagiri Logo"
        class="top-logo"
    >


    <!-- =================================================
         EFFECT CONTAINERS
         ================================================= -->

    <div id="heart-container"></div>

    <div id="sparkle-container"></div>


    <!-- =================================================
         START SCREEN
         ================================================= -->

    <main
        id="start-screen"
        class="start-screen"
    >


        <!-- HOLY BIBLE IMAGE -->

        <img
            src="https://media.istockphoto.com/id/1033500400/photo/the-holy-bible-opened-during-a-glorious-golden-sunset-vertical-shot.jpg?s=170667a&w=0&k=20&c=JyoWZjqKU7Ex9Xa1E37_bYtLDxFRaCN_kxIUBZBz6U8="
            alt="Holy Bible"
            class="bible-image"
        >


        <!-- TITLE -->

        <h1 class="main-title">

            📖 இன்றைய நம்பிக்கை தரும் நல்வாக்கு 📖

        </h1>


        <!-- TAP MESSAGE -->

        <div
            id="tap-message"
            class="tap-message"
        >

            <div class="tap-hand">
                👆
            </div>

            <div>
                Tap the Screen
            </div>

            <div>
                For
                <strong>Today's Word</strong>
            </div>

        </div>


    </main>



    <!-- =================================================
         VERSE SCREEN
         ================================================= -->

    <main
        id="verse-screen"
        class="verse-screen"
    >


        <div class="verse-wrapper">


            <!-- ===============================
                 TAMIL VERSE
                 =============================== -->

            <section
                class="verse-card tamil-card"
                id="tamilVerseCard"
            >

                <div class="verse-title">
                   📖இன்றைய நம்பிக்கை தரும் நல்வாக்கு📖
                </div>


                <div
                    class="verse-reference"
                    id="tamilReference"
                ></div>


                <div
                    class="verse-text tamil-text"
                    id="tamilVerse"
                ></div>

            </section>



            <!-- ===============================
                 ENGLISH VERSE
                 =============================== -->

            <section
                class="verse-card english-card"
                id="englishVerseCard"
            >

                <!-- <div class="verse-title english-title">
                    📖 Today's English Verse
                </div> -->


                <div
                    class="verse-reference"
                    id="englishReference"
                ></div>


                <div
                    class="verse-text english-text"
                    id="englishVerse"
                ></div>


                <!-- AMEN BUTTON -->

                <button
                    id="amenBtn"
                    type="button"
                >

                    ❤️ ஆமென்

                </button>

            </section>


        </div>


    </main>



    <!-- =================================================
         FINAL BLESSING
         ================================================= -->

    <div
        id="blessing"
        class="final-blessing"
    >

        <div>
            ✝️ ஆண்டவர் உங்களை ஆசீர்வதிப்பாராக ✝️
        </div>

        <div>
          ✝️  MAY GOD BLESS YOU ✝️
        </div>

    </div>



    <!-- =================================================
         JAVASCRIPT
         ================================================= -->

    <script src="verses.js"></script>

    <script src="script.js"></script>


</body>

</html>
